# Netlify configuration — no build step, this is a plain static site.

[build]
  publish = "."
  command = ""

# Pretty URLs: /weddings instead of /weddings.html (Netlify does this automatically,
# these redirects just make the .html versions canonical-friendly.)
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    Accept-Ranges = "bytes"
