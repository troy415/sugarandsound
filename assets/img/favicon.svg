<svg xmlns="http://www.w3.org/2000/svg" viewBox="118 68 244 244" width="244" height="244" role="img" aria-label="Sugar &amp; Sound — The Crystal Groove logo">
  <title>Sugar &amp; Sound — The Crystal Groove</title>
  <defs>
    <linearGradient id="cgRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFC3B0"/>
      <stop offset="42%" stop-color="#C98A76"/>
      <stop offset="100%" stop-color="#9E6153"/>
    </linearGradient>
    <linearGradient id="cgRoseFlat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D89C87"/>
      <stop offset="100%" stop-color="#B0705F"/>
    </linearGradient>
    <radialGradient id="cgVinyl" cx="34%" cy="28%" r="82%">
      <stop offset="0%" stop-color="#3B3A42"/>
      <stop offset="70%" stop-color="#26252B"/>
      <stop offset="100%" stop-color="#191820"/>
    </radialGradient>
  </defs>

  <!-- icon -->
  <g>
    <circle cx="240" cy="190" r="118" fill="url(#cgVinyl)"/>
    <circle cx="240" cy="190" r="118" fill="none" stroke="#C98A76" stroke-width="2"/>

    <!-- grooves -->
    <g fill="none" stroke="#D89C87" stroke-width="1">
      <circle cx="240" cy="190" r="108" opacity="0.30"/>
      <circle cx="240" cy="190" r="99" opacity="0.30"/>
      <circle cx="240" cy="190" r="90" opacity="0.30"/>
      <circle cx="240" cy="190" r="81" opacity="0.55" stroke-width="1.6"/>
    </g>

    <!-- sheen -->
    <path d="M158 122 A118 118 0 0 1 300 88" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.05" stroke-linecap="round"/>

    <!-- sugar crystal replacing the centre label -->
    <g>
      <path d="M214 146 L266 146 L288 172 L240 248 L192 172 Z" fill="url(#cgRose)"/>
      <g stroke="#24232A" stroke-width="1.4" opacity="0.38" fill="none" stroke-linejoin="round">
        <path d="M192 172 L288 172"/>
        <path d="M214 146 L227 172 L240 248"/>
        <path d="M266 146 L253 172 L240 248"/>
        <path d="M227 172 L253 172"/>
      </g>
      <path d="M214 146 L266 146 L253 172 L227 172 Z" fill="#FFFFFF" opacity="0.16"/>
      <circle cx="240" cy="190" r="5" fill="#24232A" opacity="0.85"/>
    </g>
  </g>

  </svg>
